<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#4e6838">
<canvas id="c" width="1600" height="700"></canvas>
<script src="../js/util.js"></script><script src="../js/data.js"></script><script src="../js/art.js"></script><script src="../js/art_units.js"></script><script src="../js/art_bld.js"></script><script src="../js/art_terrain.js"></script><script src="../js/icons.js"></script>
<script>
WF.ART.SS=8; const g=document.getElementById('c').getContext('2d'); const D=WF.D, ART=WF.ART;
const list=[['med_tank','aegis',0],['heavy_tank','iron',1],['hover_tank','vortex',3],['mammoth','iron',2],['gunship','aegis',0],['destroyer','vortex',1],['rifle','aegis',0],['mlrs','iron',1]];
list.forEach(([t,f,c],i)=>{const d=D.UNITS[t]; const b=ART.unitBody(t,f,c,d.radius,0), tu=ART.unitTurret(t,f,c,d.radius); const sh=ART.shadowOf(t,f,d.radius); const x=150+(i%4)*390, y=170+Math.floor(i/4)*350, S=6;
 g.save(); g.translate(x+8,y+12); g.rotate(-0.5); g.scale(S,S); g.drawImage(sh.img,-sh.w/2,-sh.h/2,sh.w,sh.h); g.restore();
 g.save(); g.translate(x,y); g.rotate(-0.5); g.scale(S,S); g.drawImage(b.img,-b.w/2,-b.h/2,b.w,b.h); if(tu) g.drawImage(tu.img,-tu.w/2,-tu.h/2,tu.w,tu.h); g.restore();});
</script></body></html>
