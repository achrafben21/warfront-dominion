<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>Warfront: Dominion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <button class="tb-btn" id="btn-menu" aria-label="Menu">☰</button>
      <div class="res" id="r-credits" title="Credits"><i class="ic-cr"></i><span>0</span><em></em></div>
      <div class="res" id="r-metal" title="Metal"><i class="ic-mt"></i><span>0</span><em></em></div>
      <div class="res" id="r-power" title="Power (generated / used)"><i class="ic-pw"></i><span>0/0</span></div>
      <div class="res" id="r-units" title="Units / cap"><i class="ic-un"></i><span>0</span></div>
      <div class="res" id="r-time"><span>0:00</span></div>
      <button class="tb-btn" id="btn-speed" title="Game speed">1×</button>
      <button class="tb-btn" id="btn-pause" aria-label="Pause">❚❚</button>
    </div>
    <div id="objectives" class="hidden"></div>
    <div id="toasts"></div>
    <div id="leftcol">
      <button class="side-btn" id="btn-box" title="Box select mode">▢</button>
      <button class="side-btn" id="btn-army" title="Select all combat units">⚔</button>
      <button class="side-btn" id="btn-idle" title="Select idle builder">🔧</button>
      <div id="groups"></div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
    <div id="selpanel" class="hidden">
      <div id="selinfo"></div>
      <div id="cmds"></div>
    </div>
    <div id="drawer" class="hidden">
      <div id="drawer-tabs"></div>
      <div id="drawer-body"></div>
    </div>
    <div id="placebar" class="hidden">
      <span id="place-msg">Tap to position</span>
      <button class="pb ok" id="place-ok">✓ Build</button>
      <button class="pb" id="place-rot">⟳ Re-tap</button>
      <button class="pb no" id="place-cancel">✕</button>
    </div>
    <div id="targetbar" class="hidden"><span id="target-msg">Select target</span><button class="pb no" id="target-cancel">✕ Cancel</button></div>
    <div id="fps" class="hidden"></div>
  </div>

  <!-- ============ SCREENS ============ -->
  <div id="screens"></div>
  <div id="modal" class="hidden"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim_core.js"></script>
<script src="js/sim_units.js"></script>
<script src="js/ai.js"></script>
<script src="js/campaign.js"></script>
<script src="js/art.js"></script>
<script src="js/art_units.js"></script>
<script src="js/art_bld.js"></script>
<script src="js/art_terrain.js"></script>
<script src="js/icons.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/input.js"></script>
<script src="js/hud.js"></script>
<script src="js/menus.js"></script>
<script src="js/main.js"></script>
</body>
</html>
